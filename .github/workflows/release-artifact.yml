name: Build v1.3 release artifact

on:
  push:
    branches:
      - codex/v1.3-artifact-build

jobs:
  build-release-jar:
    runs-on: windows-latest
    steps:
      - name: Check out merged master
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25 with JavaFX
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "25"
          java-package: jdk+fx

      - name: Build and verify release JAR
        run: .\gradlew.bat clean check coverage shadowJar

      - name: Upload executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: osps-v1.3
          path: build/libs/osps.jar
          if-no-files-found: error

